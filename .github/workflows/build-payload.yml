name: Build Payload IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-payload.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          xcodebuild -version
          sw_vers
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen + ldid
        run: |
          brew install xcodegen
          brew install ldid || true

      - name: 还原外壳源码
        run: |
          set -e
          SRCZIP=""
          for z in ios-app-clean3.zip ios-app-clean2.zip ios-app-clean.zip ios-app-source.zip; do
            if [ -f "${z}.part1" ]; then
              cat ${z}.part* > "$z"
              SRCZIP="$z"; break
            fi
          done
          echo "using $SRCZIP"
          test -n "$SRCZIP" || (echo "no source zip parts"; exit 1)
          rm -rf src && mkdir src
          unzip -o -q "$SRCZIP" -d src || unzip -o "$SRCZIP" -d src | tail -20
          ls -la src

      - name: 叠加载荷
        run: |
          set -e
          unzip -o -q lara-overlay.zip -d src
          cp -f project.yml src/project.yml
          # 覆盖所有我们改过的 Liebao/*.swift（ContentView 之前漏掉了）
          for f in App.swift ContentView.swift ShellBootstrap.swift Globals.swift Info.plist; do
            if [ -f "Liebao/$f" ]; then
              cp -f "Liebao/$f" "src/Liebao/$f"
              echo "覆盖 Liebao/$f  ($(wc -c < "src/Liebao/$f") bytes)"
            fi
          done
          echo "--- 校验关键字符串 ---"
          grep -c "自检" src/Liebao/ContentView.swift || echo "ContentView 里没有自检字样！"
          echo "lara files: $(find src/lara -type f | wc -l | tr -d ' ')"
          echo "www files:  $(find src/www -type f 2>/dev/null | wc -l | tr -d ' ')"

      - name: 生成工程
        working-directory: src
        run: |
          rm -rf Liebao.xcodeproj
          xcodegen generate || (echo "XCODEGEN FAILED"; cat project.yml; exit 1)

      - name: 编译
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project Liebao.xcodeproj \
            -scheme Liebao \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64e \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          echo "===== 编译错误（全部）====="
          grep -nE "(: error:|error: |fatal error:)" build.log | head -80 || echo "(没有 error 行)"
          echo "===== 日志尾部 ====="
          tail -50 build.log
          APP="build/Build/Products/Release-iphoneos/Liebao.app"
          if [ ! -d "" ]; then
            echo "::error::编译失败，没有产出 Liebao.app"
            exit 1
          fi
          echo "✓ 产出 "
          ls -la "" | head -20

      - name: 打包
        working-directory: src
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "NO APP"; tail -300 build.log; exit 1; fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          BN=$(basename "$APP")
          N=${BN%.app}
          APPDIR="Payload/$BN"
          echo "BN=$BN N=$N APPDIR=$APPDIR"
          echo "--- bundle 顶层 ---"
          ls -la "$APPDIR" | head -30
          if [ -f "$APPDIR/www/index.html" ]; then
            echo "www ok: $(find "$APPDIR/www" -type f | wc -l | tr -d ' ') files"
          else
            echo "www MISSING in bundle, copying from source"
            rm -rf "$APPDIR/www"
            cp -R www "$APPDIR/www"
            test -f "$APPDIR/www/index.html" || (echo "still missing"; exit 1)
            echo "copied: $(find "$APPDIR/www" -type f | wc -l | tr -d ' ') files"
          fi
          ls -la "$APPDIR/Frameworks" || true
          echo "--- BIP39 词表 ---"
          if ! ls "$APPDIR"/bip39_*.txt >/dev/null 2>&1; then
            echo "bundle 缺词表，从源码拷"
            cp -f lara/assets/bip39/*.txt "$APPDIR/" 2>/dev/null || true
            mkdir -p "$APPDIR/bip39"
            cp -f lara/assets/bip39/*.txt "$APPDIR/bip39/" 2>/dev/null || true
          fi
          ls -la "$APPDIR"/bip39_*.txt 2>/dev/null | head -5 || echo "WARN 词表未进包"
          echo "N=$N" >> $GITHUB_ENV
          echo "APPDIR=$APPDIR" >> $GITHUB_ENV

      - name: 注入权限并签名
        working-directory: src
        run: |
          set -e
          N="${{ env.N }}"
          APPDIR="${{ env.APPDIR }}"
          echo "sign $APPDIR/$N"
          if command -v ldid >/dev/null 2>&1; then
            ldid -SConfig/lara.entitlements "$APPDIR/$N" && echo "ldid main ok"
            for f in "$APPDIR/Frameworks/"*.dylib; do
              if [ -f "$f" ]; then ldid -S "$f" && echo "signed $(basename "$f")"; fi
            done
            # 兜底：包根下任何 dylib（debug dylib / preview stub）都要签
            for f in "$APPDIR"/*.dylib; do
              if [ -f "$f" ]; then ldid -S "$f" && echo "signed root $(basename "$f")"; fi
            done
            echo "--- entitlements ---"
            ldid -e "$APPDIR/$N" | head -30 || true
            echo "--- 签名后检查 ---"
            for f in "$APPDIR/$N" "$APPDIR"/*.dylib "$APPDIR/Frameworks/"*.dylib; do
              if [ -f "$f" ]; then
                if ldid -e "$f" >/dev/null 2>&1 || [ -s "$f" ]; then echo "  ok $(basename "$f")"; fi
              fi
            done
          else
            echo "ldid unavailable, skip"
          fi

      - name: 生成 IPA
        working-directory: src
        run: |
          set -e
          zip -qry Liebao-payload.ipa Payload
          ls -lh Liebao-payload.ipa
          echo "--- 内容抽查 ---"
          unzip -l Liebao-payload.ipa | grep -E "www/index.html|Frameworks/libxpf|Frameworks/libgrabkernel2|Info.plist" | head -10 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Liebao-payload-ipa
          path: |
            src/Liebao-payload.ipa
            src/build.log
          retention-days: 30

      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: payload-v1.1
          name: Liebao + Payload v1.1
          files: src/Liebao-payload.ipa
